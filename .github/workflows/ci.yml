name: ci
# Gates + three release-approval jobs. A merge deploys NOTHING: the
# semver-patch|minor|major jobs park on per-bump protected environments (release-patch|minor|major)
# until a human approves EXACTLY ONE; the v-tag it pushes is the only thing
# that deploys (via release.yml).
# (The console harness stays a local discipline — it wants the dev plane;
# wiring it into CI is a known follow-up.)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build

  # semver-patch: approval-gated release. Waits on the PROTECTED
  # environment `release-patch` until a human approves THIS job —
  # approving IS the release decision; the bump level is literal,
  # nothing derived. Environments are NEVER shared between bump jobs:
  # one environment approval releases EVERY job waiting on it (proven
  # live 2026-11-13). No Waiting badge => this env lost protection
  # (fail-open) — fix Settings → Environments before trusting releases.
  semver-patch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    environment: release-patch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: kanatabi/anvil/actions/semver-release@728231b0a8c10eab8739e75a4c5394c8f2b6386c # v6 env-model
        with:
          bump: patch
          release-bot-pat: ${{ secrets.RELEASE_BOT_PAT }}

  # semver-minor: approval-gated release. Waits on the PROTECTED
  # environment `release-minor` until a human approves THIS job —
  # approving IS the release decision; the bump level is literal,
  # nothing derived. Environments are NEVER shared between bump jobs:
  # one environment approval releases EVERY job waiting on it (proven
  # live 2026-11-13). No Waiting badge => this env lost protection
  # (fail-open) — fix Settings → Environments before trusting releases.
  semver-minor:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    environment: release-minor
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: kanatabi/anvil/actions/semver-release@728231b0a8c10eab8739e75a4c5394c8f2b6386c # v6 env-model
        with:
          bump: minor
          release-bot-pat: ${{ secrets.RELEASE_BOT_PAT }}

  # semver-major: approval-gated release. Waits on the PROTECTED
  # environment `release-major` until a human approves THIS job —
  # approving IS the release decision; the bump level is literal,
  # nothing derived. Environments are NEVER shared between bump jobs:
  # one environment approval releases EVERY job waiting on it (proven
  # live 2026-11-13). No Waiting badge => this env lost protection
  # (fail-open) — fix Settings → Environments before trusting releases.
  semver-major:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    environment: release-major
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: kanatabi/anvil/actions/semver-release@728231b0a8c10eab8739e75a4c5394c8f2b6386c # v6 env-model
        with:
          bump: major
          release-bot-pat: ${{ secrets.RELEASE_BOT_PAT }}
