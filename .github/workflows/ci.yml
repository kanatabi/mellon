name: ci
# Gates + three release-approval jobs. A merge deploys NOTHING: the
# semver-patch|minor|major jobs park on the protected `release` environment
# until a human approves EXACTLY ONE; the v-tag it pushes is the only thing
# that deploys (via release.yml).
# (The console harness stays a local discipline — it wants the dev plane;
# wiring it into CI is a known follow-up.)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build

  # semver-patch: one of THREE approval jobs. Merge to main queues them on the
  # PROTECTED `release` environment; a human approves EXACTLY ONE — approving
  # IS the release decision. If these ever run WITHOUT a Waiting badge, the
  # environment protection is missing (fail-open) — stop and fix Settings →
  # Environments before trusting any release.
  semver-patch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: kanatabi/anvil/actions/semver-release@7183eb2808bc82d05eef7cc427c239802463f432 # v2 approval cascade
        with:
          bump: patch
          release-bot-pat: ${{ secrets.RELEASE_BOT_PAT }}

  # semver-minor: same contract as semver-patch — exactly one of the three
  # may be approved per merge; approving IS the release decision. Fail-open
  # check: no Waiting badge ⇒ the `release` environment is unprotected.
  semver-minor:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: kanatabi/anvil/actions/semver-release@7183eb2808bc82d05eef7cc427c239802463f432 # v2 approval cascade
        with:
          bump: minor
          release-bot-pat: ${{ secrets.RELEASE_BOT_PAT }}

  # semver-major: same contract as the other two — exactly one of the three
  # may be approved per merge; approving IS the release decision. Fail-open
  # check: no Waiting badge ⇒ the `release` environment is unprotected.
  semver-major:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: kanatabi/anvil/actions/semver-release@7183eb2808bc82d05eef7cc427c239802463f432 # v2 approval cascade
        with:
          bump: major
          release-bot-pat: ${{ secrets.RELEASE_BOT_PAT }}
