<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="robots" content="noindex" />
		<meta name="description" content="mellon — the estate console." />
		<meta name="theme-color" content="#f8f7fb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f0e17" media="(prefers-color-scheme: dark)" />
		<!-- %sveltekit.assets% keeps this correct behind any base path; without
		     a declared icon the browser begs /favicon.ico and the access log
		     eats a 404 on every page. -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap" data-sveltekit-preload-code="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
